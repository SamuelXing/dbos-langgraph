services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dbos_langgraph_test
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d dbos_langgraph_test']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
